</style>

function trats(pid){
 const out=[],p=P(pid),mine=S.proc.filter(x=>x.pid===pid);
 for(const t of TIPOS){
  if(!t.max)continue;
  const last=mine.filter(x=>x.tipo===t.n).sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(!last)continue;
  const e=diff(today,last.data),ag=S.ag.filter(a=>a.pid===pid&&a.tipo===t.n&&a.data>=today).sort((a,b)=>a.data.localeCompare(b.data))[0];
  let st,c,txt;
  if(e>t.max){st='Vencido';c='p-red';txt=`venceu há ${dur(e-t.max)}`}
  else if(e>=t.min){st='Hora de voltar';c='p-acc';txt=`vence em ${dur(t.max-e)}`}
  else if(e>=t.min-30){st='Vence em breve';c='p-warn';txt=`voltar daqui a ${dur(t.min-e)}`}
  else{st='Em dia';c='p-ok';txt=`voltar daqui a ${dur(t.min-e)}`}
  out.push({p,t,last,e,ag,st,c,txt,de:add(last.data,t.min),ate:add(last.data,t.max),resta:t.max-e});
  if(t.n===BOTOX&&e>=10&&e<=21&&!S.ag.some(a=>a.pid===pid&&a.data>=last.data))
   out.push({p,t:{n:'Revisão do botox (15 dias)',min:15,max:21},last,e,st:'Hora de voltar',c:'p-acc',txt:'revisão de 15 dias',de:add(last.data,15),ate:add(last.data,21),resta:21-e,rev:true});
 }
 return out;
}

function mesInfo(){
 const mes=today.slice(0,7),dd=NOW.getDate(),dm=new Date(NOW.getFullYear(),NOW.getMonth()+1,0).getDate();
 const ps=S.proc.filter(x=>x.data.startsWith(mes)&&x.data<=today);

 const dia=Array(dm+1).fill(0);ps.forEach(x=>dia[+x.data.slice(8)]+=x.valor);
 const acc=[];let s=0;for(let i=1;i<=dd;i++){s+=dia[i];acc.push(s)}
 return{mes,dd,dm,fat,vend,acc,proj:fat/dd*dm,ritmo:S.meta*dd/dm};
}

function drawChart(){

  const top=Math.max(S.meta,m.proj,m.fat)*1.05,x=d=>pl+(d/m.dm)*(W-pl-pr),y=v=>pt+(1-v/top)*(H-pt-pb);
  const line=m.acc.map((v,i)=>`${i?'L':'M'}${x(i+1).toFixed(1)},${y(v).toFixed(1)}`).join('');

  <line x1="${x(0)}" y1="${y(0)}" x2="${x(m.dm)}" y2="${y(S.meta)}" stroke="#a39894" stroke-width="2" stroke-dasharray="5 6"/>
  <line x1="${lx}" y1="${ly}" x2="${x(m.dm)}" y2="${y(m.proj)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 5" opacity=".5"/>
  <path d="M${x(0)},${y(0)}${line.replace('M','L')}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${lx}" cy="${ly}" r="6" fill="var(--ink)" stroke="#fff" stroke-width="2.5"/>
  <line x1="${x(0)}" x2="${x(m.dm)}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>

 <div class="list">${comPts.map(x=>`<div class="it">${avatar(x.p)}<div class="grow"><div class="nm click" data-pac="${x.p.id}">${esc(x.p.nome)}</div><div class="sm num">${N(x.pt)} pontos · ${NIV[nivelI(x.p.id)].n}</div></div>

 <div class="sm">${x.t} indicada${x.t>1?'s':''} · ${x.c} virou paciente · ${N(x.c*IND_PTS)} pts</div></div><span class="pill ${x.c>=IND_META?'p-ok':'p-acc'}">${Math.min(x.c,IND_META)}/${IND_META}</span></div>`).join('')||'<div class="empty">Nenhuma indicação ainda. Marque “Indicada por” no cadastro da paciente.</div>'}</div>

 <div class="rule" style="border-top-color:var(--acc)"><h3>Indicação</h3><ul><li>Quem indica ganha ${IND_PTS} pontos quando a amiga faz o primeiro procedimento</li><li>A amiga indicada ganha 10% off no primeiro procedimento</li><li>A cada ${IND_META} indicações que viram pacientes: 1 limpeza de pele grátis</li></ul></div>

 ${indic.length?`<h2>Indicou</h2><div class="list">${indic.map(x=>{const ok=S.proc.some(y=>y.pid===x.id&&y.valor>0&&y.pago);return `<div class="it click" data-pac="${x.id}">${avatar(x)}<div class="grow"><div class="nm">${esc(x.nome)}</div></div><span class="pill ${ok?'p-ok':'p-warn'}">${ok?'+'+IND_PTS+' pts':'ainda não veio'}</span></div>`}).join('')}</div>
 <p class="tiny" style="margin-top:8px">${cv>=IND_META?`Já ganhou ${Math.floor(cv/IND_META)} limpeza${Math.floor(cv/IND_META)>1?'s':''} de pele grátis por indicação.`:`Faltam ${IND_META-cv} indicaç${IND_META-cv>1?'ões':'ão'} para ganhar uma limpeza de pele.`}</p>`:''}
 ${rs.length?`<h2>Prêmios resgatados</h2><div class="list">${rs.map(r=>`<div class="it"><div class="grow"><div class="nm">${esc(r.premio)}</div><div class="sm">${br(r.data)}</div></div><span class="num sm">−${N(r.pts)} pts</span><button class="btn s wa" data-rmsg="${r.id}">Mensagem</button></div>`).join('')}</div>`:''}
 <h2>Histórico</h2>${ps.length?`<div class="hist">${ps.map(x=>`<div><b>${esc(x.tipo)}</b> <span class="sm">· ${br(x.data)}</span><br><span class="sm">${esc(x.det)}${x.det?' · ':''}${x.valor?R(x.valor):'sem custo'}${x.valor&&!x.pago?' · <span class="pill p-warn">a receber</span>':''}</span> <button class="btn s" data-dp="${x.id}" style="min-height:28px;padding:2px 8px;margin-left:4px">remover</button></div>`).join('')}</div>`:'<p class="sub">Ainda sem procedimentos.</p>'}`)}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-pac]');if(!t)return;const d=t.dataset;
 if(t.matches('nav button')){view=d.v;render();scrollTo(0,0);return}
 if('close' in d)return close();
 if(d.go){view=d.go;render();scrollTo(0,0);return}
 if(t.id==='fab')return view==='pac'?fPac():fAg();
 if(t.id==='hbtn'||t.id==='addPac')return fPac();
 if(t.id==='sair'){sb.auth.signOut().then(()=>location.reload());return}
 if(t.id==='zerar'){if(d.ok){S={pac:[],proc:[],ag:[],res:[],meta:S.meta};save();render();toast('Pronto, tudo zerado. Agora é só cadastrar as pacientes.')}else{d.ok=1;t.textContent='toque de novo para confirmar';setTimeout(()=>{if(t.isConnected){delete t.dataset.ok;t.textContent='apagar exemplos e começar'}},4000)}return}
 if(t.id==='eMeta')return fMeta();
 if(t.id==='msgCopy'){const v=document.getElementById('msgTx').value;try{navigator.clipboard.writeText(v).then(()=>toast('Mensagem copiada'),()=>toast('Selecione o texto e copie'))}catch(x){toast('Selecione o texto e copie')}return}
 if(t.id==='copiar'){try{navigator.clipboard.writeText(msgClube()).then(()=>toast('Mensagem copiada'),()=>toast('Selecione o texto e copie'))}catch(x){toast('Selecione o texto e copie')}return}
 if(d.day){dSel=d.day;return render()}
 if(d.tf){tF=d.tf;return render()}
 if(d.nf!==undefined){nF=+d.nf;return render()}
 if(d.pac)return ficha(d.pac);
 if(d.agp)return fAg(d.agp,d.agt);
 if(d.np)return fProc(d.np);
 if(d.ep)return fPac(d.ep);
 if(d.rg)return fResg(d.rg);
 if(d.rz){const z=PREMIOS[+d.rz];if(pts(d.rp)<z.p)return;const nr={id:uid(),pid:d.rp,data:today,premio:z.n,pts:z.p};S.res.push(nr);save();up('resgates',nr);render();return okResg(nr)}
 if(d.pmsg)return okPts(d.pmsg);
 if(d.rmsg){const r=S.res.find(x=>x.id===d.rmsg);if(r)okResg(r);return}
 if(d.conc){const a=S.ag.find(x=>x.id===d.conc);return fProc(a.pid,a.tipo,a.id)}
 if(d.canc){S.ag=S.ag.filter(x=>x.id!==d.canc);save();del('agendamentos',d.canc);render();return toast('Horário desmarcado')}
 if(d.pago){const pp=S.proc.find(x=>x.id===d.pago);pp.pago=true;save();up('procedimentos',pp);render();return toast('Pagamento registrado')}
 if(d.dp){if(!d.ok){d.ok=1;t.textContent='confirmar?';return}const pid=S.proc.find(x=>x.id===d.dp).pid;S.proc=S.proc.filter(x=>x.id!==d.dp);save();del('procedimentos',d.dp);render();return ficha(pid)}
 if(d.del){if(!d.ok){d.ok=1;t.textContent='Toque de novo para excluir';return}del('pacientes',d.del);S.pac=S.pac.filter(x=>x.id!==d.del);S.pac.forEach(x=>{if(x.ind===d.del)x.ind=''});S.proc=S.proc.filter(x=>x.pid!==d.del);S.ag=S.ag.filter(x=>x.pid!==d.del);S.res=S.res.filter(x=>x.pid!==d.del);save();close();render();return toast('Paciente excluída')}
});
const num=s=>parseFloat(String(s).replace(/\s|R\$/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'))||0;
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));let next=null;
 if(f.dataset.f==='meta'){S.meta=num(v.meta)||S.meta;up('config',{id:'main',meta:S.meta});toast('Meta atualizada')}
 if(f.dataset.f==='pac'){const o={nome:v.nome.trim(),tel:v.tel,nasc:v.nasc,obs:v.obs,ind:v.ind===f.dataset.id?'':v.ind};if(f.dataset.id){Object.assign(P(f.dataset.id),o);up('pacientes',P(f.dataset.id));toast('Paciente salva')}else{const np={id:uid(),...o};S.pac.push(np);up('pacientes',np);next=()=>okPac(np.id)}}
 if(f.dataset.f==='ag'){if(!S.pac.length)return toast('Cadastre uma paciente primeiro');const na={id:uid(),pid:v.pid,data:v.data,hora:v.hora,tipo:v.tipo};S.ag.push(na);up('agendamentos',na);next=()=>okAg(na)}
 if(f.dataset.f==='proc'){if(!S.pac.length)return toast('Cadastre uma paciente primeiro');const antes=nivelI(v.pid);
  const npr={id:uid(),pid:v.pid,data:v.data,tipo:v.tipo,det:v.det,valor:num(v.valor),pago:!!v.pago};S.proc.push(npr);up('procedimentos',npr);
  if(f.dataset.ag){S.ag=S.ag.filter(x=>x.id!==f.dataset.ag);del('agendamentos',f.dataset.ag)}const dep=nivelI(v.pid);toast(dep>antes?`${first(P(v.pid).nome)} subiu para ${NIV[dep].n}!`:'Procedimento registrado')}
 save();close();render();if(next)next();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
render();
if(ONLINE)startOnline();
}
</script>
</body>
</html>
